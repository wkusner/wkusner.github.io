# The Palace — the one file that furnishes every room.
# Edit this file, commit, push. See /palace/curator/ for the full guide.

title: The Palace
start: 1
latitude: 44.26        # Appleton: the pendulum, the sky, the sun through the windows
longitude: -88.41
facing: 180            # a visitor in frame e faces south, so the windows catch the sun

help: >-
  <p>This is a memory palace for my instruments, games, drafts, and books. Every room keeps something. You can also skip the walking and use the Catalogue.</p>

wings:
  foyer:        {name: "The Foyer",                  color: "#B5452B"}
  instruments:  {name: "The Instrument Gallery",     color: "#B07A1E"}
  turnings:     {name: "The Turnings",               color: "#B5452B"}
  numbers:      {name: "The Numbers, below",         color: "#2F5E9E"}
  pond:         {name: "The Lily Pond",              color: "#3C7A54"}
  schoolroom:   {name: "The Schoolroom",             color: "#3C7A54"}
  workshop:     {name: "The Workshop",               color: "#7A4A86"}
  lectures:     {name: "The Lecture Wing",           color: "#2C7B80"}
  archive:      {name: "The Archive",                color: "#7A4A86"}

ranks:
  - {name: "Visitor",                     at: 0,  color: "#D9D2C0"}
  - {name: "Reader",                      at: 4,  color: "#7A9E7E"}
  - {name: "Third Assistant Librarian",   at: 8,  color: "#B8322A"}
  - {name: "Second Assistant Librarian",  at: 13, color: "#E0B42F"}
  - {name: "Keeper of the Stacks",        at: 19, color: "#2F4E8C"}

items:
  golden-key: "a golden key, stamped φ"
  primer: "A Young Lady's Illustrated Primer"

rooms:

# ───────────────────────────── FOYER ─────────────────────────────
- id: 1
  name: The Hexagonal Reading Room
  wing: foyer
  shape: hex
  decor: [shelves, lamp, rug, window]
  at: [5, 5]
  text: >-
    Six walls, four of them doors. Every reading room should be a hexagon. The lamp comes on at dusk, whether or not anyone is reading.

    On the lectern lies the plan of a book that isn't written yet. The card catalogue in the corner knows where everything is. It is the honest way through, and the walking is the other way.
  again: The rug has worn a little where you keep crossing it.
  phases:
    - when: "hours:0-1"
      text: "It is past midnight. A door that isn't there by day stands open behind you."
      doors: [{to: 23, wall: front, oneway: true, title: "the midnight door"}]
    - {when: dawn, text: "Dawn. The first reader of the day is always the dust."}
  marginalia:
    - "Hexagons tile the plane, which is why Borges could build his library of them. They do not tile space; his galleries stack in floors joined by spiral stairs."
    - "The memory palace is the oldest technique on this site: put each thing to be remembered in a room, then walk the rooms."
  sources:
    - "The hexagonal galleries of Borges's “The Library of Babel.”"
    - "The method of loci, credited by Cicero to the poet Simonides of Ceos, who could name the guests at a collapsed banquet hall by remembering where each had sat."
  bib:
    - "Jorge Luis Borges, “La biblioteca de Babel,” 1941; in <i>Ficciones</i>, 1944."
    - "Cicero, <i>De Oratore</i>, Book II."
    - "Frances A. Yates, <i>The Art of Memory</i>, 1966."
  doors:
    - {to: 2,  wall: right, title: "brass and glass"}
    - {to: 8,  wall: left,  title: "a draft that turns"}
    - {to: 13, wall: back,  turn: r, title: "a stair going down", say: "The stair winds a quarter turn as it descends."}
    - {to: 20, wall: front, title: "chalk dust"}
  objects:
    - {kind: unwritten, icon: lectern, title: "Lie Groups You Can Hold", note: "The book plan: slide rules as exponential maps, turned and pressed into SO(3), G₂, and their cousins. Drafts are in the Workshop."}
    - {kind: device, icon: books, title: "The card catalogue", action: catalogue, note: "Everything here, listed plainly."}
    - {kind: device, icon: map, title: "A map, mostly blank", action: map, note: "It fills in as you walk."}

# ─────────────────────────── INSTRUMENTS ───────────────────────────
- id: 2
  name: The Gallery of Rules
  wing: instruments
  decor: [cases, lamp]
  at: [6, 4]
  text: >-
    Long cases line the walls, and every one holds a rule: straight, circular, complex, finite-field, relativistic. A slide rule is the exponential map you can hold. Sliding adds logarithms, and reading multiplies numbers.

    One case is empty. Its card says <i>Instruments Cabinet: sectors, Napier's bones, Gunter's scale, sextants. In preparation.</i>
  marginalia:
    - "A slide rule is the exponential map of the multiplicative group of positive reals: lengths add in the Lie algebra, numbers multiply in the group."
  sources:
    - "Napier's logarithms (1614), Gunter's logarithmic scale (1620), and Oughtred's circular slide rule (about 1630)."
  bib:
    - "Florian Cajori, <i>A History of the Logarithmic Slide Rule and Allied Instruments</i>, 1909."
    - "Peter M. Hopp, <i>Slide Rules: Their History, Models and Makers</i>, 1999."
  doors:
    - {to: 1, wall: left}
    - {to: 3, wall: back}
    - {to: 4, wall: right, title: "a narrow stair up"}
  objects:
    - {kind: device, icon: rule, title: "Slide Rule Cabinet", href: "/slide-rules/", note: "Straight, circular, complex, finite-field, and relativistic rules to drag and read."}
    - {kind: unwritten, icon: rule, title: "The Instruments Cabinet", note: "Sectors, Napier's bones and their descendants, log and trig tables, Gunter's scale, ruler constructions, scraping and flattening, inclinometers, and sextants."}
    - {kind: unwritten, icon: rule, title: "Elliptic slide rule", note: "A rule built on the ℘ function, using transparencies."}

- id: 3
  name: The Bench
  wing: instruments
  decor: [bench, lamp, window]
  at: [7, 3]
  text: >-
    A drafting bench with four instruments that measure area by walking around it. The polar planimeter turns its wheel, the Prytz hatchet drags a blade, and the x–y encoder counts. Each has its own way of being wrong.
  marginalia:
    - "Every planimeter here is Green's theorem with a different mechanism for the integrand."
  sources:
    - "Jakob Amsler's polar planimeter (1854) and Holger Prytz's hatchet planimeter (1880s)."
  bib:
    - "Ronald W. Gatterdam, “The planimeter as an example of Green's theorem,” <i>American Mathematical Monthly</i> 88 (1981)."
    - "Robert L. Foote, “Geometry of the Prytz planimeter,” <i>Reports on Mathematical Physics</i> 42 (1998)."
  doors:
    - {to: 2, wall: left}
    - {to: 5, wall: right}
  objects:
    - {kind: device, icon: planimeter, title: "Planimeter Bench", href: "/planimeters/", note: "Polar, linear, hatchet, and x–y planimeters, with a running error budget."}

- id: 4
  name: The Observatory
  wing: instruments
  shape: round
  decor: [sky, window]
  at: [6, 2]
  text: >-
    A small dome, and its ceiling is the sky over Appleton right now: the actual stars, the moon in its actual phase, and whichever planets are up. It repaints itself by the minute. By day it fades to the sun and the brightest stars. The chart is stereographic, like the Wulff net on the table, so circles in the sky stay circles on the ceiling.

    The dome turns with you. If a corridor has turned you, north is no longer at the top. Come in mirrored and the whole sky is reversed, the way the ceiling of Grand Central Terminal was painted.
  mirror: You are seeing the sky the way a god outside it would. The constellations run backwards.
  widget: sky
  notes:
    - {when: night, text: "The dome is open. A trapdoor has appeared behind you, and the pendulum hall shows through it."}
    - {when: "moon:full", text: "Full moon. Even the net's grid lines cast shadows."}
  marginalia:
    - "The dome is computed, not painted. Stars come from the Yale Bright Star Catalogue by way of d3-celestial, and the planets from JPL's approximate orbital elements. The sun and moon use low-precision formulas, good to about a degree."
    - "Stereographic projection sends circles to circles and keeps angles. It is the projection of the Wulff net, of the astrolabe, and of the Riemann sphere."
  sources:
    - "George Wulff's net (1902), the stereographic planisphere of Ptolemy's <i>Planisphaerium</i>, and the astrolabe."
    - "The ceiling of Grand Central Terminal (1913), whose zodiac runs backwards: it shows the sky from outside."
  bib:
    - "Tristan Needham, <i>Visual Complex Analysis</i>, 1997, ch. 3."
    - "Olaf Frohn, d3-celestial (software and data), BSD license."
  doors:
    - {to: 2, wall: left}
    - {to: 7, wall: front, when: "night|dusk", title: "a trapdoor, open after dark"}
  objects:
    - {kind: device, icon: net, title: "Stereonet Slide Rule", href: "/stereonet/", note: "The SO(3) slide rule: a Wulff net with a turning overlay and a frame-matching challenge."}

- id: 5
  name: The Perspective Corridor
  shape: corridor
  wing: instruments
  decor: [lamp]
  at: [8, 3]
  text: >-
    The corridor is longer than it looks, or shorter. The floorboards are evenly spaced, and that is the only thing you can trust. Four points on a line keep their cross-ratio under any picture of them.
  marginalia:
    - "The floorboards in this picture are equally spaced in depth, so in the picture each gap is the one before it scaled by a fixed rule (y = k/z). The cross-ratio of any four boards is the same in the room and in the picture."
  sources:
    - "Alberti's construction of the perspective floor, and Desargues's projective geometry."
  bib:
    - "Leon Battista Alberti, <i>De pictura</i>, 1435."
    - "H. S. M. Coxeter, <i>Projective Geometry</i>, 2nd ed., 1974."
  doors:
    - {to: 3, wall: left}
    - {to: 6, wall: back}
  objects:
    - {kind: device, icon: cross, title: "Cross-Ratio Ruler", href: "/cross-ratio/", note: "Read true distances off a perspective picture."}

- id: 6
  name: The Hothouse
  wing: instruments
  decor: [glasshouse, window]
  at: [8, 5]
  text: >-
    It's warm, and the arithmetic has gone tropical. As the base of the logarithm grows, addition melts into max and multiplication into plus. The plants don't mind.
  phases:
    - {when: night, text: "After dark the night-blooming cereus opens. It has the largest flower in the room and the shortest season: one night."}
    - {when: "sun:up", text: "The panes fog in the sun, and the tropical rule's scale sweats."}
  marginalia:
    - "Tropical arithmetic is the limit of ordinary arithmetic on logarithms as the base goes to infinity: log_t(t^a + t^b) → max(a, b). Physicists call it Maslov dequantization."
  sources:
    - "The word “tropical” honors the Brazilian mathematician Imre Simon."
  bib:
    - "Diane Maclagan and Bernd Sturmfels, <i>Introduction to Tropical Geometry</i>, AMS, 2015."
  doors:
    - {to: 5, wall: left}
    - {to: 20, wall: right, title: "a door that smells of chalk"}
  objects:
    - {kind: device, icon: plant, title: "Tropical Slide Rule", href: "/tropical/", note: "Watch addition turn into max."}

- id: 7
  name: The Pendulum Hall
  wing: instruments
  decor: [pendulum, lamp]
  at: [5, 2]
  text: >-
    A long wire from the ceiling, a brass bob, and a ring of pegs on the floor. The plane of the swing turns, slowly, clockwise. Nothing pushes it. The floor is turning underneath, and the pendulum is the one thing in the building that isn't.

    At latitude φ the plane comes around by 360° · sin φ in a sidereal day. Equivalently, carrying a vector once around the circle of latitude, keeping it as straight as the sphere allows, brings it back turned by the area of the cap above you, 2π(1 − sin φ). That turn is holonomy, and this hall has some of its own: one of its doors is a mirror.
  mirror: In the mirror, the pendulum still turns clockwise. Of everything here, it is the one thing that doesn't care which way you are facing.
  widget: pendulum
  marginalia:
    - "The swing plane turns 360° · sin φ per sidereal day relative to the floor. Parallel transport around the circle of latitude gives the same thing as a holonomy: 2π(1 − sin φ), the area of the cap above the circle, which is −2π sin φ mod 2π."
  sources:
    - "Léon Foucault's pendulum, shown in Paris in 1851, at the Observatoire and then under the dome of the Panthéon."
    - "Umberto Eco's novel, which opens beside the pendulum in the Musée des Arts et Métiers."
  bib:
    - "Umberto Eco, <i>Il pendolo di Foucault</i>, 1988."
    - "John Oprea, “Geometry and the Foucault pendulum,” <i>American Mathematical Monthly</i> 102 (1995)."
  doors:
    - {to: 4, wall: right, title: "up, to the dome"}
    - {to: 8, wall: left, turn: s, look: mirror, title: "a door of silvered glass", say: "You step through the glass. Left and right trade places."}
  objects:
    - {kind: ref, icon: book, title: "Foucault's Pendulum", by: "Umberto Eco", note: "The novel opens beside the real one, in Paris."}

# ─────────────────────────── TURNINGS ───────────────────────────
- id: 8
  name: The Turning Room
  wing: turnings
  decor: [lamp, rug]
  at: [4, 3]
  text: >-
    A square room, on purpose. Its symmetries are the eight in the corner of your screen: four turns and four flips. Hamilton's arcs are painted on a globe in the middle. Lay them head to tail and you have composed two rotations.

    Some of the doors in this wing turn you as you pass through them. Watch the F.
  mirror: You came in through glass. The room is the same room, but the F in the corner is reversed, and something in the cellar is now visible that wasn't before.
  marginalia:
    - "The F in the menu bar is an element of D₄. Every door in the palace can act on it."
  sources:
    - "Hamilton's quaternions (1843), carved into Brougham Bridge in Dublin, and his representation of rotations by arcs on the sphere."
  bib:
    - "Simon L. Altmann, <i>Rotations, Quaternions, and Double Groups</i>, 1986."
    - "John Stillwell, <i>Naive Lie Theory</i>, 2008."
  doors:
    - {to: 1, wall: right}
    - {to: 7, wall: back, turn: s, look: mirror, title: "a door of silvered glass", say: "Through the glass again."}
    - {to: 9, wall: left}
  objects:
    - {kind: device, icon: turns, title: "Hamilton's Turns", href: "/turns/", note: "Compose rotations by laying arcs head to tail on a sphere."}
    - {kind: device, icon: net, title: "The SO(3) slide rule", href: "/stereonet/", hide: true, note: "Also in the Observatory."}

- id: 9
  name: The Card Room
  wing: turnings
  decor: [cardtables, lamp]
  at: [3, 3]
  text: >-
    A green baize table, and a deck with only eight kinds of card: ±1, ±i, ±j, ±k. The left hand and the right hand play different games, since ij = k but ji = −k.

    A second table is set for a card game no one has invented yet. It's war, but the cards are group elements, and you win by making your stack equal to your opponent's.
  marginalia:
    - "In the simulations for Group War, the quaternion group gave about a 27% chance per turn of being able to equalize, against 56% for ℤ₄."
  sources:
    - "Hamilton's relations i² = j² = k² = ijk = −1, made into a card game."
  bib:
    - "John H. Conway and Derek A. Smith, <i>On Quaternions and Octonions</i>, 2003."
  doors:
    - {to: 8, wall: right}
    - {to: 10, wall: back}
    - {to: 11, wall: left}
    - {to: 27, wall: front, title: "salt air"}
  objects:
    - {kind: device, icon: cards, title: "Quaternion Cards", href: "/quaternion-cards/", note: "A card game in the quaternion group."}
    - {kind: unwritten, icon: cards, title: "Group War", note: "Klein, ℤ₄, Q₈, S₃, D₄, octonions. In simulation, the chance of being able to equalize on a turn runs from about 0.56 (ℤ₄) down to about 0.12 (S₄)."}

- id: 10
  name: The Lock Room
  wing: turnings
  decor: [lamp]
  at: [2, 2]
  text: >-
    A brass lock with four dials, and on its lid three equations. The dials hold the four roots of x⁴ − 2. Only the moves that keep the lid true are allowed, and those moves make up the Galois group.

    The far door has the same lock built into it.
  marginalia:
    - "The lid's three relations are enough: any permutation that keeps them is one of the eight symmetries of the square of roots."
  sources:
    - "The standard textbook example of a Galois group that is dihedral."
  bib:
    - "David S. Dummit and Richard M. Foote, <i>Abstract Algebra</i>, 3rd ed., 2004, ch. 14."
    - "Ian Stewart, <i>Galois Theory</i>, 4th ed., 2015."
  doors:
    - {to: 9, wall: right}
    - to: 12
      wall: left
      look: dials
      title: "the locked door"
      hint: "Its lock asks a question. Try the Galois Lock first."
      riddle:
        id: galois
        q: "How many arrangements of the four dials will the lock ever reach?"
        a: ["8", "eight"]
        yes: "Eight. The dials spin through the symmetries of a square, and the door swings open."
        no: "The dials stick. Count again, or go play with the lock on the table."
  objects:
    - {kind: device, icon: lock, title: "Galois Lock", href: "/symmetry-lock/", note: "A lock whose moves are the Galois group of x⁴ − 2."}
    - {kind: unwritten, icon: lock, title: "The General Galois Lock", note: "Choose a polynomial and get a different lock."}

- id: 11
  name: The Tile Room
  wing: turnings
  decor: [tilefloor, dial, lamp]
  at: [2, 4]
  text: >-
    The floor is a fifteen puzzle, tiles you can slide. Half of the arrangements can never be reached from the other half. A dial on the wall shows the sign of the permutation times (−1) to the distance of the blank, and that number never changes.

    The door to the cellar turns you half around.
  marginalia:
    - "The floor shows the famous impossible position: 14 and 15 swapped. The parity dial says it can't be solved."
  sources:
    - "The 15 puzzle, a craze of 1880. Sam Loyd later claimed it, falsely, and offered a prize for swapping the 14 and 15."
  bib:
    - "W. W. Johnson and W. E. Story, “Notes on the ‘15’ puzzle,” <i>American Journal of Mathematics</i> 2 (1879)."
    - "Jerry Slocum and Dic Sonneveld, <i>The 15 Puzzle</i>, 2006."
  doors:
    - {to: 9, wall: right}
    - {to: 12, wall: back, turn: r2, title: "a door that turns you around", say: "You come out facing the way you came."}
  objects:
    - {kind: device, icon: tiles, title: "Fifteen and the Parity Dial", href: "/fifteen/", note: "The 15 puzzle with its permutation, parity invariant, and commutators shown live."}

- id: 12
  name: The Crystal Cellar
  wing: turnings
  decor: [lattice, lamp]
  at: [1, 3]
  text: >-
    The walls are a crystal, one atom after another in a hexagonal lattice, except where they aren't. Walk a loop that would close in a perfect crystal. If it doesn't close, you have circled a dislocation, and the gap is the Burgers vector. It's a kind of holonomy too.
  mirror: In the mirror, one wall of the cellar is a door.
  marginalia:
    - "The dashed red loop on the wall would close in a perfect crystal. The heavy red segment is the closure failure: the Burgers vector b. It is the holonomy of the lattice around the defect."
  sources:
    - "Volterra's dislocations (1907) and J. M. Burgers's circuits (1939)."
  bib:
    - "D. Hull and D. J. Bacon, <i>Introduction to Dislocations</i>, 5th ed., 2011."
  doors:
    - {to: 10, wall: right}
    - {to: 11, wall: back, turn: r2}
    - {to: 22, wall: left, when: mirror, twist: true, look: mirror, title: "a door only mirrors show", say: "You go through the door the mirror showed you."}
  objects:
    - {kind: device, icon: crystal, title: "Defectsweeper", href: "/defectsweeper/", note: "Find dislocations hidden in a hexagonal crystal by walking Burgers circuits."}

# ─────────────────────────── NUMBERS ───────────────────────────
- id: 13
  name: The Great Spiral
  wing: numbers
  decor: [glacier, stair, shelves]
  at: [4, 6]
  text: >-
    A stair cut into ice winds down past shelf after shelf. The deeper the shelves, the older the numbers on them. Doors open off the landings. Some are marked for librarians of a certain rank. A visitor may look, but not take.
  again: You know these landings now. The ice remembers your footprints longer than you would think.
  marginalia:
    - "Ranks here are earned by remembering rooms, not by age."
  sources:
    - "The Great Library of the Clayr in Garth Nix's <i>Lirael</i>, cut into a glacier, with its spiral ramp, its ranked assistant librarians, and its dangerous lower stacks."
  bib:
    - "Garth Nix, <i>Lirael</i>, 2001."
  doors:
    - {to: 1, wall: back, turn: r3, title: "up, to the reading room", say: "The stair unwinds you."}
    - {to: 14, wall: left}
    - {to: 15, wall: right}
    - {to: 16, wall: front, title: "further down"}
    - {to: 22, wall: back, needs: "rank:3", hint: "Closed stacks. Second Assistant Librarians and above. Remember more rooms.", title: "the closed stacks"}
  objects:
    - {kind: device, icon: books, title: "Ranks of the library", action: ranks, note: "Every rank comes from remembering more rooms."}

- id: 14
  name: The Tree of Distances
  wing: numbers
  decor: [glacier, bigtree]
  at: [3, 7]
  text: >-
    A tree grows out of the ice, branching p ways at every level. Two numbers are close when they share a long trunk, that is, when their difference is divisible by a high power of p. In this room, 1 + 2 + 4 + 8 + … converges, to −1.
  marginalia:
    - "The tree drawn here branches three ways: p = 3."
  sources:
    - "Kurt Hensel's p-adic numbers (1897), and Ostrowski's theorem (1916) that these and the reals are all the completions of ℚ."
  bib:
    - "Fernando Q. Gouvêa, <i>p-adic Numbers: An Introduction</i>, 2nd ed., 1997."
  doors:
    - {to: 13, wall: right}
    - {to: 15, wall: left}
  objects:
    - {kind: device, icon: tree, title: "p-adic Ruler", href: "/p-adic/", note: "A branching-tree ruler for p-adic distance."}

- id: 15
  name: Funes's Room
  wing: numbers
  shape: square
  decor: [gloom, cot, names]
  at: [2, 6]
  text: >-
    A dark room, lit only by the end of a cigarette. In Borges's story, Ireneo Funes lies here, unable to forget anything. He invented a numbering of his own in 1886 and soon passed twenty-four thousand. It began with his annoyance that the famous Thirty-Three gauchos took two signs and two words, not one. So every number got its own name.

    The narrator objected, rightly, that this was the opposite of a number system. Saying 365 means three hundreds, six tens, and five ones. Funes's names have no place value, so they have no arithmetic. They are pure memory.
  again: Funes remembers your last visit, and every step you took to get back here.
  widget:
    type: funes
    names:
      - {n: 7013, name: "Máximo Pérez"}
      - {n: 7014, name: "The Railroad"}
      - {n: 500,  name: "nine"}
      - {n: 33,   name: "(the Thirty-Three: two signs, two words, the first irritation)"}
      - {name: "Luis Melián Lafinur"}
      - {name: "Olimar"}
      - {name: "sulphur"}
      - {name: "the reins"}
      - {name: "the whale"}
      - {name: "the gas"}
      - {name: "the caldron"}
      - {name: "Napoleon"}
      - {name: "Agustín de Vedia"}
      - {name: "meat blanket"}
  marginalia:
    - "The names on the wall are the ones Funes gives in the story. The text linked from this room is an English translation, where the “poncho full of meat” comes out as a “meat blanket.”"
  sources:
    - "Borges's “Funes el memorioso” (1942)."
    - "A. R. Luria's case study of the mnemonist Solomon Shereshevsky, who also could not forget."
  bib:
    - "Jorge Luis Borges, “Funes the Memorious,” trans. James E. Irby, in <i>Labyrinths</i>, 1962."
    - "A. R. Luria, <i>The Mind of a Mnemonist</i>, 1968."
  doors:
    - {to: 13, wall: right}
    - {to: 14, wall: back}
    - {to: 17, wall: left}
  objects:
    - {kind: ref, icon: book, title: "Funes the Memorious", by: "Jorge Luis Borges", href: "https://vigeland.caltech.edu/ist4/lectures/funes%20borges.pdf", note: "The English translation quoted here. In it, the poncho full of meat is a “meat blanket.”"}

- id: 16
  name: Lamé's Corridor
  shape: corridor
  wing: numbers
  decor: [fibfloor, glacier, lamp]
  at: [4, 8]
  text: >-
    The corridor is an a × b rectangle. Each time you cut off the largest square that fits, the corridor narrows, and the squares are the steps of Euclid's algorithm. In 1844 Gabriel Lamé proved the first worst-case bound on an algorithm's running time: the number of steps is never more than five times the number of decimal digits of the smaller number.

    The sharper form: at most ln b / ln φ + 1 steps. The longest corridors come from neighboring Fibonacci numbers, since each quotient is 1 and each square is as small as it can be. Find a corridor as long as the bound allows, and the last square drops something into your hand.
  widget: {type: euclid, a: 89, b: 34, award: golden-key, awardText: "A golden key, stamped φ, falls out of the last square."}
  marginalia:
    - "The floor of the corridor is a golden rectangle cut into squares, the picture of Euclid's algorithm on two consecutive Fibonacci numbers, with the spiral through its squares. It is drawn in true perspective, so the squares shrink with distance as well as with the algorithm."
    - "The widget uses the bound from my write-up, n ≤ ln b / ln φ + 1 for the smaller number b."
  sources:
    - "Gabriel Lamé's 1844 note in the <i>Comptes rendus</i>, the first worst-case analysis of an algorithm."
  bib:
    - "W. Kusner, “Run time of the Euclidean algorithm” (notes)."
    - "Ross Honsberger, <i>Mathematical Gems II</i>, MAA, 1976."
    - "Melvyn B. Nathanson, <i>Elementary Methods in Number Theory</i>, 1999."
    - "Jeffrey Shallit, “Origins of the analysis of the Euclidean algorithm,” <i>Historia Mathematica</i> 21 (1994)."
    - "Donald E. Knuth, <i>The Art of Computer Programming</i>, vol. 2, §4.5.3."
  doors:
    - {to: 13, wall: front, title: "back up the stair"}
    - {to: 17, wall: back}
  objects:
    - {kind: paper, icon: scroll, title: "Run time of the Euclidean algorithm", by: "W. Kusner", note: "My write-up of Lamé's theorem, by way of Sierpiński, Grossman, and Nathanson."}

- id: 17
  name: The Clock Room
  wing: numbers
  decor: [clockface, lamp, shelves]
  at: [2, 8]
  text: >-
    A clock with twelve hours, counted by twelves: dozens, grosses, great grosses. Bakers and hours both like twelve, because it divides by 2, 3, 4, and 6.

    One door turns with the hour hand. It leads somewhere different every hour, and once in every four hours it leads to the center.
  widget: clock
  phases:
    - {when: "minutes:0-3", text: "The clock is striking the hour, in dozens."}
  marginalia:
    - "The digits ↊ and ↋ are Isaac Pitman's dozenal digits, encoded in Unicode since 2015."
  sources:
    - "Bakers' dozens and grosses, the Dozenal Society, and the long history of counting by twelves."
  bib:
    - "Georges Ifrah, <i>The Universal History of Numbers</i>, 1999."
  doors:
    - {to: 15, wall: right}
    - {to: 16, wall: front}
    - {to: [18, 19, 21, 23], wall: back, label: "⟳", oneway: true, title: "the door on the clock's hand"}
  objects:
    - {kind: unwritten, icon: clock, title: "The Number Systems Museum", note: "Tallies, Roman, Babylonian, Egyptian, Maya, Kaktovik, bases, the French counting words, dozen and gross, and Archimedes's Sand Reckoner."}
    - {kind: unwritten, icon: scroll, title: "Continued fractions and nested radicals", note: "Euclid's algorithm, written down differently."}

- id: 18
  name: The Hexagon
  wing: numbers
  shape: hex
  decor: [shelves, lamp]
  at: [1, 7]
  text: >-
    Another hexagon, or the same one. Shelves on four walls, five shelves to a wall, thirty-two books to a shelf. The books are all different, and almost all of them are noise.

    The shelves here fold. Take the door marked “?” and you could come out anywhere in the palace.
  widget: babel
  marginalia:
    - "Borges's books have 410 pages of 40 lines of about 80 characters, from 25 symbols. That is 25^1,312,000 books."
  sources:
    - "Borges's library, and Pratchett's L-space for the folding door."
    - "Jonathan Basile's online Library of Babel, which, like this room, can find any page you type."
  bib:
    - "William Goldbloom Bloch, <i>The Unimaginable Mathematics of Borges' Library of Babel</i>, 2008."
  doors:
    - {to: 17, wall: right}
    - {to: random, wall: left, label: "?", look: shelves, title: "folded shelves", say: "The shelves fold, and the corridor is shorter than it should be."}
    - {to: 23, wall: back, needs: "has:golden-key", look: gold, hint: "A small gold lock with a φ on it.", title: "the golden door"}
  objects:
    - {kind: ref, icon: book, title: "The Library of Babel", by: "Jorge Luis Borges"}

# ─────────────────────────── POND, SCHOOL, WORKSHOP ───────────────────────────
- id: 19
  name: The Lily Pond
  wing: pond
  decor: [pool, window, woodcut]
  at: [6, 8]
  text: >-
    Lily pads crowd the water, as many as will fit without overlapping. How tightly can they pack, and how do you prove it? On the wall are Kepler's woodcuts of stacked cannonballs. Barlow's plans show the ways to stack layers of spheres, and the skeletons of FCC and HCP are drawn beside them. The machinery for the lily pads is still being brought over from another wing.
  phases:
    - {when: day, text: "By day the lilies are open, and the packing is loose: every flower wants a little more room than its pad."}
    - {when: "night|dusk", text: "At night the lilies close. The pads lie flat and tight, and the packing is as good as it gets."}
  marginalia:
    - "The pads in the pond sit on a hexagonal lattice, the densest packing of equal disks in the plane (Thue; Fejes Tóth)."
  sources:
    - "Kepler's essay on the six-cornered snowflake (1611) and his conjecture about cannonballs; William Barlow's stackings of spheres (1883)."
  bib:
    - "Thomas C. Hales, “A proof of the Kepler conjecture,” <i>Annals of Mathematics</i> 162 (2005)."
    - "J. H. Conway and N. J. A. Sloane, <i>Sphere Packings, Lattices and Groups</i>, 3rd ed., 1999."
    - "George G. Szpiro, <i>Kepler's Conjecture</i>, 2003."
  doors:
    - {to: 20, wall: right}
    - {to: 21, wall: left}
    - {to: 17, wall: front}
    - {to: 26, wall: back, title: "the model room"}
  objects:
    - {hidden: true, kind: page, icon: pond, title: "Packing Problems", href: "/packing/", note: "The packing page, still being furnished."}
    - {kind: unwritten, icon: pond, title: "The lily pads", note: "The packing-problem machinery from the old papers."}
    - {hidden: true, kind: figure, icon: hex, title: "Kepler's woodcuts", href: "/assets/figures/keplerwoodcut1.pdf", note: "<a href='/assets/figures/keplerwoodcut1.pdf'>one</a>, <a href='/assets/figures/keplerwoodcut2.pdf'>two</a>, <a href='/assets/figures/woodcutabcde.pdf'>lettered</a>"}
    - {hidden: true, kind: figure, icon: hex, title: "Barlow's plans", href: "/assets/figures/barlowplans.pdf", note: "<a href='/assets/figures/barlow.pdf'>Barlow</a>, <a href='/assets/figures/barlowplans5.pdf'>plans 5</a>, <a href='/assets/figures/barlowplanse.pdf'>plans e</a>"}
    - {hidden: true, kind: figure, icon: crystal, title: "FCC and HCP", href: "/assets/figures/fccskel.pdf", note: "<a href='/assets/figures/fccskel.pdf'>FCC skeleton</a>, <a href='/assets/figures/hcpskel.pdf'>HCP skeleton</a>, <a href='/assets/figures/icoskel.pdf'>icosahedral</a>, <a href='/assets/figures/FCCstress.pdf'>FCC stress</a>, <a href='/assets/figures/HCPstress.pdf'>HCP stress</a>"}
    - {hidden: true, kind: figure, icon: hex, title: "Contact graphs, n = 3 to 14", href: "/assets/figures/n12.pdf", note: "<a href='/assets/figures/n3.pdf'>3</a> <a href='/assets/figures/n6.pdf'>6</a> <a href='/assets/figures/n9.pdf'>9</a> <a href='/assets/figures/n12.pdf'>12</a> <a href='/assets/figures/n13.pdf'>13</a> <a href='/assets/figures/n14.pdf'>14</a>"}
    - {hidden: true, kind: figure, icon: crystal, title: "Bottlenecks", href: "/assets/figures/bottleneck1.pdf"}

- id: 20
  name: The Schoolroom
  wing: schoolroom
  decor: [chalkboard, desks, lamp]
  at: [7, 6]
  text: >-
    Desks, a chalkboard, and a box of cards. This is where the devices get used for practice: fractions first, then whatever MATH 102 and 103 need next.
  phases:
    - {when: ["weekday", "hours:8-17"], text: "Class is in session. Somebody is at the board finding a common denominator."}
    - {when: "night|weekend", text: "The chairs are up on the desks. The chalk tray has been wiped, mostly."}
  marginalia:
    - "The board shows the step students skip: rewriting over the least common denominator before adding."
  sources:
    - "Practice games for MATH 102; Fraction Target is a fraction-card cousin of the game 24."
  doors:
    - {to: 1, wall: back}
    - {to: 6, wall: right}
    - {to: 19, wall: left}
    - {to: 24, wall: front, title: "the lecture wing"}
    - {to: 28, wall: right, title: "a small door, painted"}
  objects:
    - {kind: device, icon: fraction, title: "Fraction Target", href: "/fraction-target/", note: "Make the target from four fraction cards. Every deal can be solved."}
    - {kind: unwritten, icon: fraction, title: "Coefficient Knobs", note: "Turn a, b, and c on a quadratic and watch the vertex trace its locus. Then cubics, and the cusp 4p³ + 27q² = 0."}

- id: 21
  name: The Workshop
  wing: workshop
  decor: [workbench, lamp, window, shelves]
  at: [6, 7]
  text: >-
    Sawdust, plaster, and drafts. The shelf by the door holds the books that aren't written yet. They are real books in every respect except that they don't exist.

    A linking book lies open on the bench. Touch the picture and you're back in the reading room.
  phases:
    - {when: night, text: "The plaster in the molds is setting overnight. Don't touch it."}
  marginalia:
    - "The shelf of unwritten books is the palace's to-do list. When one gets written, it moves out to its room."
  sources:
    - "The shelf of books never written, from the library of Dream in Neil Gaiman's <i>The Sandman</i>."
    - "The linking books of Myst (1993)."
    - "The plaster models of the Brill and Schilling collections."
  bib:
    - "Neil Gaiman, <i>The Sandman</i>, 1989–1996."
    - "Cyan, <i>Myst</i>, 1993."
  doors:
    - {to: 19, wall: right}
    - {to: 16, wall: left, oneway: true}
  objects:
    - {kind: link, icon: book, title: "A linking book: the reading room", to: 1, say: "The picture swallows you."}
    - {kind: unwritten, icon: unwritten, title: "SO(3) Lab Manual", note: "Building the stereonet slide rule, with printables. A draft exists."}
    - {kind: unwritten, icon: unwritten, title: "The Handbook", note: "Circular rules, root systems, Dynkin diagrams, and finite fields. 37 pages of draft."}
    - {kind: unwritten, icon: unwritten, title: "Plaster molds", note: "3D-printed molds for plaster models of the objects in the book."}
    - {kind: unwritten, icon: unwritten, title: "The G₂ rule and the sl(3) rule", note: "Root-system slide rules on transparencies."}

