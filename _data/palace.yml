  objects:
    - {kind: ref, icon: scroll, title: "An STC fragment", by: "Warhammer 40,000", note: "A Standard Template Construct, the data-seed of a whole lost technology. Recovering a complete one is a holy act. Every device in this palace is meant to be a small STC."}
    - {kind: ref, icon: book, title: "The Orange Catholic Bible, and a Mentat", by: "Frank Herbert, Dune", note: "After the Butlerian Jihad outlawed thinking machines, people trained their own minds to compute. A slide rule is a polite compromise."}
    - {kind: ref, icon: book, title: "The Red Book of Westmarch", by: "J. R. R. Tolkien", note: "Also the archives of Minas Tirith, where a forgotten scroll mattered more than any army."}
    - {kind: ref, icon: net, title: "A palantír", by: "J. R. R. Tolkien", note: "A seeing-stone. Compare the Observatory's dome, which only shows what is really there."}
    - {kind: ref, icon: book, title: "The Book of Gramarye", by: "Susan Cooper, The Dark Is Rising", note: "Read once and then destroyed; what it taught survives only in memory. Funes would have been the ideal reader."}
    - {kind: ref, icon: clock, title: "The alethiometer", by: "Philip Pullman, His Dark Materials", note: "Thirty-six symbols, each with endless meanings, read by setting three hands. The palace keeps a crude copy in the middle of this room."}
    - {kind: ref, icon: books, title: "The Great Library of the Clayr", by: "Garth Nix, Lirael", note: "A library carved into a glacier, with ranked librarians and stacks that bite. The Great Spiral is its cousin."}
    - {kind: ref, icon: books, title: "The Aedificium", by: "Umberto Eco, The Name of the Rose", note: "A labyrinth built as a library, with the finis Africae hidden at its heart."}
    - {kind: ref, icon: hex, title: "The Library of Babel", by: "Jorge Luis Borges", note: "Every possible book, in hexagons without end."}
    - {kind: ref, icon: books, title: "L-space", by: "Terry Pratchett", note: "Enough books in one place bend space, and all libraries become one library."}
    - {kind: ref, icon: book, title: "The Encyclopedia Galactica", by: "Isaac Asimov, Foundation", note: "A library compiled as a cover story for a plan."}
    - {kind: ref, icon: scroll, title: "The Isolate Tower", by: "Ursula K. Le Guin, Earthsea", note: "Where the Master Namer keeps the lists of true names."}
    - {kind: ref, icon: hex, title: "Llull's Ars Magna", by: "Ramon Llull, c. 1305", note: "Real: nested paper wheels that combine concepts mechanically. Leibniz read it. It belongs in the Instrument Gallery."}
    - {kind: ref, icon: scroll, title: "The memex", by: "Vannevar Bush, “As We May Think,” 1945", note: "Real: a desk that stores a whole library and the trails a reader makes through it. The nearest ancestor of this palace."}
    - {kind: ref, icon: books, title: "The Library of Alexandria", note: "Real, and lost."}
    - {kind: ref, icon: scroll, title: "The Voynich manuscript", note: "Real, and still unread."}
    - {kind: unwritten, icon: hex, title: "Llull's wheels", note: "A working volvelle of Llull's combinatorial wheels."}

primer:
  "2":  {teaser: "every rule is an exponential map you can hold", lesson: "A slide rule adds lengths, and the scale is logarithmic, so adding lengths multiplies numbers.", q: "Why can't a slide rule add 2 + 3?", a: "Its scale turns addition of lengths into multiplication of numbers. To add you'd need a plain ruler, whose scale is the identity."}
  "3":  {teaser: "a wheel measures area by walking around it", lesson: "A planimeter traces the edge of a shape and reads off the area inside, which is Green's theorem in brass.", q: "If you trace the boundary backwards, what happens?", a: "You get the same area with a minus sign. The orientation of the loop matters."}
  "7":  {teaser: "a pendulum turns although nothing turns it", lesson: "The swing of the pendulum keeps its direction while the earth turns under it. In Appleton it comes round once every 34 hours or so.", q: "Where on earth does the pendulum turn once a day?", a: "At the poles, where sin φ = 1. At the equator it doesn't turn at all."}
  "8":  {teaser: "two turns add like arrows on a sphere", lesson: "Rotations don't commute. Turn a book a quarter turn forward and then a quarter turn left; then do it in the other order.", q: "Which group do the eight symmetries of a square form?", a: "The dihedral group D₄. It's the frame the palace carries you in."}
  "10": {teaser: "a lock only opens for symmetries", lesson: "The roots of x⁴ − 2 can be shuffled only in ways that keep every rational relation true.", q: "How many ways are there?", a: "Eight, the symmetries of a square, out of 24 shuffles."}
  "11": {teaser: "half the arrangements can never be reached", lesson: "Every slide of the fifteen puzzle changes the permutation's sign and moves the blank one step; together, nothing changes.", q: "Can you swap just the 14 and 15?", a: "No. That would change the invariant."}
  "15": {teaser: "a man remembered everything and could add nothing", lesson: "Funes gave every number its own name. Without place value, names can be memorized but not computed with.", q: "What does the 6 in 365 mean?", a: "Six tens. Funes's system has no way to say that."}
  "16": {teaser: "the slowest gcd is made of Fibonacci numbers", lesson: "Euclid's algorithm cuts off squares. Fibonacci rectangles cut off one square at a time, so they take the longest.", q: "How many steps for gcd(89, 55)?", a: "Nine. The numbers fall back through the Fibonacci sequence: 89, 55, 34, 21, 13, 8, 5, 3, 2, 1."}
  "4":  {teaser: "the ceiling is tonight's real sky", lesson: "The dome uses stereographic projection, which sends circles to circles. The horizon is the edge of the dome.", q: "Which star stays put at the top of the sky's turning?", a: "Polaris, very nearly. It sits about 44° up in Appleton, which is the latitude."}
  "27": {teaser: "every islander either always lies or never does", lesson: "When a knave describes what a knight would say, the answer you hear is false either way.", q: "If you ask any islander 'Are you a knight?', what do they say?", a: "Yes, every time. So the question tells you nothing."}
