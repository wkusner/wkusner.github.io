    Hedges higher than your head, and turnings that all look alike. The maze has a habit: some turnings carry you round a quarter turn, and some turn you inside out, so left and right trade places. The heart of the maze lets in only those who arrive mirrored.
  doors:
    - {to: 36, wall: right, title: "back to the knot garden"}
    - {to: 37, wall: front, turn: r, title: "a turning in the hedge", say: "The path bends round. It looks like the same place, turned."}
    - {to: 37, wall: left, turn: s, title: "a turning that doubles back", say: "The path doubles back on itself, and the hedges seem to have swapped sides."}
    - {to: 41, wall: back, needs: "mirror", hint: "The hedge here only parts for someone who has been turned inside out.", title: "a gap in the hedge"}
  objects:
    - {kind: book, icon: book, wall: right, title: "Maze", by: "Christopher Manson, 1985", note: "Forty-five numbered rooms, a shortest path of sixteen steps, and a riddle along it. The house's numbered rooms are a homage."}
  marginalia:
    - "The turnings are holonomy you can walk: each door applies an element of the dihedral group to your frame. The heart needs the reflection, which no number of quarter turns will give you."
  bib:
    - "Christopher Manson, <i>Maze: Solve the World's Most Challenging Puzzle</i>, 1985."
    - "Jorge Luis Borges, “The Garden of Forking Paths,” 1941."

- id: 41
  closed: renovation
  name: The Heart of the Maze
  wing: garden
  floor: lawn
  ceiling: open
  decor: [hedges, fountain]
  at: [4, 10]
  secret: true
  text: >-
    A small square of lawn with a fountain, and a stone bench. You came in mirrored, and you'll leave mirrored unless you find another turning, or use the compass.

    Most mazes are trees, and a hand on one wall will get you out. This one isn't: its turnings are a group, and the way out depends on how you've been turned.
  doors:
    - {to: 37, wall: front, title: "back into the maze"}
  objects:
    - {kind: book, icon: book, wall: left, title: "The Garden of Forking Paths", by: "Jorge Luis Borges, 1941", note: "A labyrinth in time, not space: a novel in which every choice is taken, and all the futures happen."}
    - {kind: unwritten, icon: hex, wall: left, title: "A labyrinth, to be laid in the turf", note: "The seven-circuit classical labyrinth: one path, no choices, all the way to the center."}
  marginalia:
    - "The hand-on-the-wall rule works exactly when the maze's walls are connected, a tree, as graph theorists say. A loop of hedge you can't reach from the outer wall defeats it."

- id: 38
  closed: renovation
  name: The Sunflower Bed
  wing: garden
  floor: gravel
  ceiling: open
  decor: [hedges, phyllo, sunflowers]
  at: [5, 10]
  text: >-
    A round bed laid out seed by seed in Vogel's spiral: the n-th seed at distance √n from the center and n times the golden angle around. Count the spirals and you get Fibonacci numbers, 13, 21, and 34 here, because the golden angle is as far as an angle can get from any fraction.

    Around the edge, sunflowers. By day they turn to face the sun, wherever it really is; by night they face east, where it will rise.
  doors:
    - {to: 36, wall: back, title: "the knot garden"}
    - {to: 40, wall: right, title: "the orrery lawn"}
  objects:
    - {kind: device, icon: crystal, wall: back, title: "The golden angle", note: "360° × (1 − 1/φ) ≈ 137.508°. Its continued fraction is all ones, so it is the worst approximable number: no seed ever falls exactly behind another."}
    - {kind: unwritten, icon: plant, wall: back, title: "Turing's sunflowers", note: "Turing's last work was on phyllotaxis. In 2012 a citizen-science project grew hundreds of sunflowers to test it; most, though not all, counted Fibonacci."}
  marginalia:
    - "Vogel's model, 1979: r = c√n, θ = n · 137.508°. The square root keeps the seeds evenly packed; the golden angle keeps them from lining up."
  bib:
    - "Helmut Vogel, “A better way to construct the sunflower head,” <i>Mathematical Biosciences</i>, 1979."
    - "Jonathan Swinton and others, “Novel Fibonacci and non-Fibonacci structure in the sunflower,” <i>Royal Society Open Science</i>, 2016."

- id: 39
  closed: renovation
  name: The Moon Garden
  wing: garden
  floor: gravel
  ceiling: open
  decor: [hedges, moonflowers, armillary]
  at: [6, 9]
  widget: sundial
  text: >-
    Pale flowers in clipped bushes: moonflowers, evening primrose, nicotiana. By day they're shut. At dusk they open, and they glow a little under the moon.

    In the middle stands an armillary sphere set up as an equatorial dial. Its rod points at the celestial pole, and its band lies in the plane of the equator, so its hours are evenly spaced, fifteen degrees each. The rod's shadow on the band is the sun's own time, read straight off the brass.
  doors:
    - {to: 36, wall: left, title: "the knot garden"}
    - {to: 40, wall: front, title: "the orrery lawn"}
  objects:
    - {kind: unwritten, icon: clock, wall: left, title: "A moon dial's volvelle", note: "A rotating disc that converts moon time to sun time by the moon's age. For now the dials here tell it as they see it."}
  marginalia:
    - "An equatorial dial is the easy one: tilt the dial plate until it's parallel to the equator, and the hour lines are evenly spaced. The horizontal dial in the court is the same dial, projected onto the ground."
  bib:
    - "Albert E. Waugh, <i>Sundials: Their Theory and Construction</i>, 1973."

- id: 40
  closed: renovation
  name: The Orrery Lawn
  wing: garden
  floor: lawn
  ceiling: open
  decor: [hedges, orrery]
  at: [6, 10]
  text: >-
    A brass orrery on a stone pedestal in the middle of the lawn, with the planets where they really are today, from Mercury out to Neptune. The distances are squeezed so Neptune fits; the angles are true. At night the real planets are overhead, and you can check one against the other.
  doors:
    - {to: 39, wall: back, title: "the moon garden"}
    - {to: 38, wall: left, title: "the sunflower bed"}
  objects:
    - {kind: device, icon: orrery, wall: left, title: "The ephemeris", action: planets, note: "Every planet tracked: where it is now, when it rises and sets, how bright it is, how far, and in which constellation."}
    - {kind: unwritten, icon: scroll, wall: left, title: "A planet walk, to scale", note: "The solar system on a scale where the sun is a beach ball: Neptune would be about two miles off, a long way past the edge of the lawn."}
  marginalia:
    - "The positions come from JPL's Keplerian elements for the planets, good to a few hundredths of a degree for 1800–2050."
    - "The first orrery of the modern kind was made around 1712 by George Graham and Thomas Tompion, and copied for Charles Boyle, the fourth Earl of Orrery, who gave it his name."
  bib:
    - "E. M. Standish, “Keplerian Elements for Approximate Positions of the Major Planets,” JPL."
    - "Jean Meeus, <i>Astronomical Algorithms</i>, 1991."

primer:
  "2":  {teaser: "every rule is an exponential map you can hold", lesson: "A slide rule adds lengths, and the scale is logarithmic, so adding lengths multiplies numbers.", q: "Why can't a slide rule add 2 + 3?", a: "Its scale turns addition of lengths into multiplication of numbers. To add you'd need a plain ruler, whose scale is the identity."}
  "3":  {teaser: "a wheel measures area by walking around it", lesson: "A planimeter traces the edge of a shape and reads off the area inside, which is Green's theorem in brass.", q: "If you trace the boundary backwards, what happens?", a: "You get the same area with a minus sign. The orientation of the loop matters."}
  "7":  {teaser: "a pendulum turns although nothing turns it", lesson: "The swing of the pendulum keeps its direction while the earth turns under it. In Appleton it comes round once every 34 hours or so.", q: "Where on earth does the pendulum turn once a day?", a: "At the poles, where sin φ = 1. At the equator it doesn't turn at all."}
  "8":  {teaser: "two turns add like arrows on a sphere", lesson: "Rotations don't commute. Turn a book a quarter turn forward and then a quarter turn left; then do it in the other order.", q: "Which group do the eight symmetries of a square form?", a: "The dihedral group D₄. It's the frame the house carries you in."}
  "10": {teaser: "a lock only opens for symmetries", lesson: "The roots of x⁴ − 2 can be shuffled only in ways that keep every rational relation true.", q: "How many ways are there?", a: "Eight, the symmetries of a square, out of 24 shuffles."}
  "11": {teaser: "half the arrangements can never be reached", lesson: "Every slide of the fifteen puzzle changes the permutation's sign and moves the blank one step; together, nothing changes.", q: "Can you swap just the 14 and 15?", a: "No. That would change the invariant."}
  "15": {teaser: "a man remembered everything and could add nothing", lesson: "Funes gave every number its own name. Without place value, names can be memorized but not computed with.", q: "What does the 6 in 365 mean?", a: "Six tens. Funes's system has no way to say that."}
  "16": {teaser: "the slowest gcd is made of Fibonacci numbers", lesson: "Euclid's algorithm cuts off squares. Fibonacci rectangles cut off one square at a time, so they take the longest.", q: "How many steps for gcd(89, 55)?", a: "Nine. The numbers fall back through the Fibonacci sequence: 89, 55, 34, 21, 13, 8, 5, 3, 2, 1."}
  "4":  {teaser: "the ceiling is tonight's real sky", lesson: "The dome uses stereographic projection, which sends circles to circles. The horizon is the edge of the dome.", q: "Which star stays put at the top of the sky's turning?", a: "Polaris, very nearly. It sits about 44° up in Appleton, which is the latitude."}
  "27": {teaser: "every islander either always lies or never does", lesson: "When a knave describes what a knight would say, the answer you hear is false either way.", q: "If you ask any islander 'Are you a knight?', what do they say?", a: "Yes, every time. So the question tells you nothing."}
