  bib:
    - "Vannevar Bush, “As We May Think,” <i>The Atlantic</i>, July 1945."
    - "Ramon Llull, <i>Ars generalis ultima</i>, 1305–1308."
    - "Philip Pullman, <i>Northern Lights</i>, 1995."
    - "Frank Herbert, <i>Dune</i>, 1965."
