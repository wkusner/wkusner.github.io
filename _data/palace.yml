- id: 36
  closed: renovation
  name: The Knot Garden
  wing: garden
  floor: gravel
  ceiling: open
  decor: [hedges, knot]
  at: [5, 9]
  text: >-
    Past the sundial the paving gives way to gravel, and the walls to clipped box. In the middle is a knot garden, and this one is a knot in earnest: a single hedge that closes on itself, rising over and dipping under at each crossing. It's a trefoil, the simplest knot that can't be untied.

    Gardeners have laid out knots since the Tudors. Topologists have argued about them since Tait, who tabulated them in the 1870s because Kelvin thought atoms might be knotted vortices in the ether. The atoms weren't, but the table survived.
  doors:
    - {to: 34, wall: back, title: "the sundial court"}
    - {to: 37, wall: left, title: "the hedge maze"}
    - {to: 39, wall: right, title: "the moon garden"}
    - {to: 38, wall: front, title: "the sunflower bed"}
  objects:
    - {kind: device, icon: tree, wall: left, title: "The trefoil, drawn", note: "Three crossings, and no way to fewer: the crossing number of the trefoil is 3. It is chiral, too. Its mirror image is a different knot, which you can check by walking around the hedge in a mirrored frame."}
    - {kind: unwritten, icon: cross, wall: left, title: "A table of knots, to be planted", note: "The figure-eight, the cinquefoil, and the rest of Tait's table up to seven crossings, each a bed of its own."}
    - {kind: unwritten, icon: scroll, wall: right, title: "Knots for tying", note: "The bowline, the clove hitch, the sheet bend: the practical knots, with the mathematics of each. A rope's knot is an open curve; tie its ends together and it becomes a knot in the topologist's sense."}
  marginalia:
    - "A knot is a closed curve in space, up to wiggling without cutting. The hedge rises and dips so the crossings are honest: over and under, not just touching."
    - "Tait, Kirkman, and Little tabulated knots by hand through the 1890s. The Perko pair, two entries in that table that are really the same knot, wasn't caught until 1974."
  bib:
    - "Colin Adams, <i>The Knot Book</i>, 1994."
    - "Peter Guthrie Tait, “On Knots,” <i>Transactions of the Royal Society of Edinburgh</i>, 1877."
    - "Clifford Ashley, <i>The Ashley Book of Knots</i>, 1944."

- id: 37
  closed: renovation
