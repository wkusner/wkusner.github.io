renovation:
  note: "Closed for renovation. The house is being rebuilt a few rooms at a time; this one will open again when it's ready. — W. K."

letter: |
  Visitor,

  You have come in by the front door, which is the only one that is always open. This house is mostly a library: of instruments and games, of books that exist and books that don't yet, and of a few rooms that only make sense at night.

  The rooms keep real time. The sun comes in where the sun actually is, and the weather in the windows is the weather in Appleton. Some doors keep hours. Some loops don't bring you back where you started.

  On the desk: a ring of keys and the full plan, if you'd like every door open; a folded map and a compass, if you'd rather find your way; or leave everything where it is and walk in with nothing. You can always come back and change your mind.

  Most of the house is closed while I rebuild it. The office is open, and there is a linking book in it that will take you to the archive.

  The board on the right goes everywhere directly. The board on the left has this week's problem. Out the left-hand door is a court with a sundial and the open sky; there is an astrolabe hanging there, if you want the sky over somewhere else.

  W. K.

  P.S. To wend is to turn, or to go one's way. Here it means both.

