  sources:
    - "The interactive book of Neal Stephenson's novel, which raises the girl who reads it."
  bib:
    - "Neal Stephenson, <i>The Diamond Age: Or, A Young Lady's Illustrated Primer</i>, 1995."
  doors:
    - {to: 20, wall: left}
  objects:
    - {kind: primer, icon: book, title: "A Young Lady's Illustrated Primer", action: primer, item: primer, note: "Open it here, or anywhere once it's in your pocket."}
    - {kind: ref, icon: book, title: "The Diamond Age", by: "Neal Stephenson"}

- id: 29
  name: The Hall of Impossible Libraries
  wing: archive
  secret: true
  shape: oct
  decor: [shelves, lamp, stars, alethiometer]
  at: [-1, 4]
  text: >-
    The shelves here hold the libraries that never were, or not quite: the great stores of knowledge from other people's books. Every one of them is a different answer to the question this palace asks, which is what it means to keep everything you know in one place and still be able to find it.

    In the middle of the room stands an instrument with thirty-six symbols and three hands.
  widget: oracle
  marginalia:
    - "The alethiometer here is my own: its symbols are things in the palace, and it answers with a room. The same three hands give the same answer all day, and a different one tomorrow."
  sources:
    - "The libraries and instruments on the shelves, each credited on its card."
  bib:
