    - {kind: ref, icon: net, title: "A palantír", by: "J. R. R. Tolkien", note: "A seeing-stone. Compare the Observatory's dome, which only shows what is really there."}
    - {kind: ref, icon: book, title: "The Book of Gramarye", by: "Susan Cooper, The Dark Is Rising", note: "Read once and then destroyed; what it taught survives only in memory. Funes would have been the ideal reader."}
    - {kind: ref, icon: clock, title: "The alethiometer", by: "Philip Pullman, His Dark Materials", note: "Thirty-six symbols, each with endless meanings, read by setting three hands. The house keeps a crude copy in the middle of this room."}
    - {kind: ref, icon: books, title: "The Great Library of the Clayr", by: "Garth Nix, Lirael", note: "A library carved into a glacier, with ranked librarians and stacks that bite. The Great Spiral is its cousin."}
