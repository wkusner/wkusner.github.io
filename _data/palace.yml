  at: [-1, 4]
  text: >-
    The shelves here hold the libraries that never were, or not quite: the great stores of knowledge from other people's books. Every one of them is a different answer to the question this house asks, which is what it means to keep everything you know in one place and still be able to find it.

    In the middle of the room stands an instrument with thirty-six symbols and three hands.
  widget: oracle
  marginalia:
