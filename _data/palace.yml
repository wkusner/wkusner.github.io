- id: 27
  name: The Island of Two Kinds
  wing: turnings
  decor: [sand, window, sea]
  at: [3, 1]
  text: >-
    Sand on the floor and two doors in the back wall. The islanders here come in two kinds: knights, who always tell the truth, and knaves, who always lie. Raymond Smullyan collected them by the hundred.

    Each puzzle is dealt fresh, and each has exactly one answer. A solver checks every possible world before the islanders speak. Solve three and the barred door at the far end of the beach opens.
  widget: {type: knights, need: 3}
  marginalia:
    - "Every puzzle here is generated, then checked against every assignment of knights and knaves and every choice of door. Only puzzles with one right door are shown."
  sources:
    - "Raymond Smullyan's island of knights and knaves."
  bib:
    - "Raymond Smullyan, <i>What Is the Name of This Book?</i>, 1978."
    - "Raymond Smullyan, <i>The Lady or the Tiger?</i>, 1982."
    - "Raymond Smullyan, <i>To Mock a Mockingbird</i>, 1985."
    - "Raymond Smullyan, <i>Forever Undecided</i>, 1987."
  doors:
    - {to: 9, wall: front, title: "back to the card room"}
    - {to: 10, wall: back, oneway: true}
    - {to: 12, wall: back, oneway: true, needs: "solved:island", look: bars, hint: "Barred. Solve three puzzles on the island.", title: "the barred door", say: "The bar lifts. You go down to the cellar."}
  objects:
    - {kind: ref, icon: book, title: "The Lady or the Tiger?", by: "Raymond Smullyan"}
    - {kind: ref, icon: book, title: "Forever Undecided", by: "Raymond Smullyan", note: "Knights and knaves, all the way up to Gödel."}
    - {kind: unwritten, icon: tree, title: "The Mockingbird Forest", note: "Smullyan's birds as combinators: S, K, and the mockingbird M, where Mx = xx. A device for composing them."}

- id: 28
  name: The Nursery
  wing: schoolroom
  decor: [lowshelves, window, lamp, rug]
  at: [9, 6]
  text: >-
    A small room with low shelves. On the rug lies a book bound in something that isn't quite leather. In Stephenson's novel, the Primer was a book that raised the girl who read it, teaching her through stories that rewrote themselves around her.

    This one is humbler. It knows where you have been in the palace and where you haven't. Pick it up and it will travel with you.
  marginalia:
