# The Wending House — the one file that furnishes every room.
# Edit this file, commit, push. See /palace/curator/ for the full guide.

title: The Wending House
start: 0
latitude: 44.26        # Appleton: the pendulum, the sky, the sun through the windows
longitude: -88.41
facing: 180            # a visitor in frame e faces south, so the windows catch the sun

help: >-
  <p>This is a memory palace for my instruments, games, drafts, and books. Every room keeps something. You can also skip the walking and use the Catalogue.</p>

