    - "Isaac Asimov, <i>Foundation</i>, 1951."
    - "Ursula K. Le Guin, <i>A Wizard of Earthsea</i>, 1968."
    - "Terry Pratchett, <i>Guards! Guards!</i>, 1989."
  doors:
