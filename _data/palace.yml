  text: >-
    Sand on the floor and two doors in the back wall. The islanders here come in two kinds: knights, who always tell the truth, and knaves, who always lie. Raymond Smullyan collected them by the hundred.

    Each puzzle is dealt fresh, and each has exactly one answer. A solver checks every possible world before the islanders speak. Solve three and the barred door at the far end of the beach opens.
