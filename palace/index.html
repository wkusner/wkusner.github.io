<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Palace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1E8; --paper2:#FFFFFF; --ink:#141210; --muted:#55504A; --line:#141210;
  --void:#141210; --spot:#C8452B; --accent:var(--spot); --glow:var(--spot);
  --desk1:#D9D6CE; --desk2:#BDB9AF;
  --fell:"IM Fell English",Georgia,serif; --fellsc:"IM Fell English SC","IM Fell English",Georgia,serif;
  --chrome:"Pixelify Sans","Chicago","Geneva",ui-monospace,monospace; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --brass:var(--spot); --display:var(--fellsc); --serif:var(--fell);
}
:root[data-light="dawn"]{ --paper:#F3EEE4; }
:root[data-light="dusk"]{ --paper:#EFE9DD; --desk1:#CFCBC1; --desk2:#B1ACA1; }
:root[data-light="night"]{
  --paper:#121110; --paper2:#1A1917; --ink:#ECE8DE; --muted:#AFA99C; --line:#ECE8DE;
  --desk1:#26241F; --desk2:#1A1916; --void:#050505;
}
:root[data-ink="1bit"]{ --spot:var(--ink); }
*{box-sizing:border-box}
html{background:var(--desk1)}
body{margin:0;color:var(--ink);font-family:var(--fell);min-height:100vh;
  background-color:var(--desk1);
  background-image:repeating-conic-gradient(var(--desk2) 0 25%, var(--desk1) 0 50%);
  background-size:4px 4px;}
a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--spot)}
/* menubar */
.menubar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:4px 12px;background:var(--paper2);border-bottom:2px solid var(--ink);font:400 15px var(--chrome);position:sticky;top:0;z-index:10}
.menubar .home{font:600 15px var(--chrome);text-decoration:none;color:var(--ink);padding:3px 10px 3px 0;margin-right:6px}
.menubar .home b{color:var(--spot)}
.menubar button{font:400 15px var(--chrome);background:transparent;color:var(--ink);border:0;padding:3px 10px;cursor:pointer}
.menubar button:hover,.menubar button:focus-visible{background:var(--ink);color:var(--paper2);outline:none}
.menubar .clock{margin-left:auto;font:400 14px var(--chrome)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
/* windows */
.win{background:var(--paper2);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.tb{display:flex;align-items:center;gap:8px;height:24px;padding:0 6px;border-bottom:2px solid var(--ink);
  background:repeating-linear-gradient(to bottom, var(--paper2) 0 2px, var(--ink) 2px 3px, var(--paper2) 3px 4px);background-clip:content-box;}
.tb .box{width:14px;height:14px;border:2px solid var(--ink);background:var(--paper2);flex:none;cursor:pointer;padding:0}
.tb .box:hover{background:var(--ink)}
.tb .t{margin:0 auto;padding:0 10px;background:var(--paper2);font:600 14px var(--chrome);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
.wb{padding:12px 14px}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:400 13px var(--chrome);margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--paper2);padding:1px 8px;box-shadow:2px 2px 0 var(--ink)}
.vest{width:11px;height:11px;display:inline-block;border:1.5px solid var(--ink)}
.gnomon{width:22px;height:22px}
.roomhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
.roomnum{font:400 58px/1 var(--fellsc);color:var(--paper2);background:var(--spot);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);min-width:78px;text-align:center;padding:6px 10px 2px}
.roomname{font:italic 400 34px/1.1 var(--fell);background:var(--paper2);padding:2px 8px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:inline-block}
.wingname{font:400 13px var(--chrome);text-transform:uppercase;letter-spacing:.12em;margin-top:8px;background:var(--paper2);display:inline-block;padding:0 6px;border:1px solid var(--ink)}
.stage svg{display:block;width:100%;height:auto;background:var(--paper)}
.stage .hot{cursor:pointer}
.stage .hot:hover .hl,.stage .hot:focus .hl{stroke:var(--spot);stroke-width:4}
.stage .hot:focus{outline:none}
.cols{display:grid;grid-template-columns:1fr 310px;gap:20px;margin-top:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}.roomnum{font-size:44px;min-width:60px}.roomname{font-size:26px}}
.text p{font-size:19px;line-height:1.55;margin:.1em 0 .8em}
.text p:first-child::first-letter{font-family:var(--fellsc);float:left;font-size:3.3em;line-height:.85;padding:4px 8px 0 0;color:var(--spot)}
.text p.again{font-style:italic;color:var(--muted)}
.text p.again::first-letter{all:unset}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.list li{font-size:16px;line-height:1.35}
.list .k{font:400 11px var(--chrome);text-transform:uppercase;letter-spacing:.06em;margin-right:6px;border:1px solid var(--ink);padding:0 4px}
.doorbtn,.btn{font:400 14px var(--chrome);background:var(--paper2);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;text-align:left;box-shadow:none}
.doorbtn{width:100%}
.doorbtn:hover,.btn:hover,.doorbtn:focus-visible,.btn:focus-visible{background:var(--ink);color:var(--paper2);outline:none}
.doorbtn:hover .note,.doorbtn:focus-visible .note{color:var(--paper2)}
.btn.primary{border-width:3px;box-shadow:0 0 0 2px var(--paper2),0 0 0 4px var(--ink);margin:2px}
.note{font-size:15px;color:var(--muted);line-height:1.4}
.doorbtn .note{font:400 13px var(--chrome)}
.widget{margin-top:18px}
.widget input{font:15px var(--mono);padding:4px 8px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);width:120px;border-radius:0}
.widget .row,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.mono{font-family:var(--mono)}
.big{font:600 34px var(--chrome)}
.panel h3,.sheet h3{font:600 13px var(--chrome);text-transform:uppercase;letter-spacing:.1em;margin:0 0 8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding:6vh 12px;z-index:20;overflow:auto}
.overlay.open{display:flex}
.sheet{max-width:900px;width:100%}
.cat-wing{margin:16px 0 4px;font:600 13px var(--chrome);text-transform:uppercase;letter-spacing:.1em;border-bottom:2px solid var(--ink);padding-bottom:2px}
.cat-item{padding:5px 0;border-bottom:1px dotted var(--ink);display:flex;gap:10px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.cat-item .t{font-size:17px}
.cat-item .m{font:400 12px var(--chrome)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--paper2);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 14px;font:400 14px var(--chrome);opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;max-width:90vw}
.toast.on{opacity:1}
.mirror-text{display:inline-block;transform:scaleX(-1)}
.warn{color:var(--spot)}
.ok{font-weight:600}
table.cur{border-collapse:collapse;font:13px var(--mono);width:100%}
table.cur td,table.cur th{border-bottom:1px solid var(--ink);padding:3px 6px;text-align:left;vertical-align:top}
.babel{font:13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;background:var(--paper);border:2px solid var(--ink);padding:10px;max-height:240px;overflow:auto}
.babel mark{background:var(--spot);color:var(--paper2)}
.panel{border:2px solid var(--ink);padding:10px 12px;background:var(--paper2)}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin-bottom:10px}
.tab{font:400 14px var(--chrome);background:var(--paper2);color:var(--ink);border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;padding:3px 12px;margin-right:-2px;cursor:pointer;position:relative;top:2px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper2)}
.ann ol,.ann ul{margin:0;padding-left:22px}
.ann li{font-size:17px;line-height:1.5;margin-bottom:6px}
.ann.marg li{font-style:italic;list-style:"✎  "}
.ann .empty{font:400 13px var(--chrome);color:var(--muted)}
footer{margin-top:30px;font:400 13px var(--chrome)}
footer span{background:var(--paper2);border:1px solid var(--ink);padding:2px 8px}
</style>
</head>
<body>
<div class="menubar">
  <a class="home" href="/">❦ <b>The Palace</b></a>
  <button type="button" id="b-map">Map</button>
  <button type="button" id="b-cat">Catalogue</button>
  <button type="button" id="b-lamp">Lamps</button>
  <button type="button" id="b-ink">Ink</button>
  <button type="button" id="b-ann">Annotations</button>
  <button type="button" id="b-primer" style="display:none">Primer</button>
  <button type="button" id="b-help">How to walk</button>
  <span class="clock" id="mclock"></span>
</div>
<main>
  <div class="status" id="status"></div>
  <div class="roomhead"><span class="roomnum" id="rnum"></span><span><div class="roomname" id="rname"></div><br><div class="wingname" id="rwing"></div></span></div>
  <div class="win stage"><div class="tb"><button class="box" type="button" id="b-close" aria-label="Back to the reading room" title="Back to the reading room"></button><span class="t" id="cardt"></span></div><div id="stage"></div></div>
  <div class="win" id="annwin" style="display:none;margin-top:20px"><div class="tb"><button class="box" type="button" id="ann-x" aria-label="Close annotations"></button><span class="t">Annotations</span></div>
    <div class="wb"><div class="tabs" role="tablist"><button type="button" class="tab" data-tab="marginalia">Marginalia</button><button type="button" class="tab" data-tab="sources">Sources</button><button type="button" class="tab" data-tab="bib">Bibliography</button></div><div id="annb" class="ann"></div></div></div>
  <div class="cols">
    <div class="win"><div class="tb"><span class="t">Notes</span></div><div class="wb"><div class="text" id="rtext"></div><div class="widget" id="widget"></div></div></div>
    <aside style="display:flex;flex-direction:column;gap:20px">
      <div class="win"><div class="tb"><span class="t">Doors</span></div><div class="wb"><ul class="list" id="doors"></ul></div></div>
      <div class="win"><div class="tb"><span class="t">In this room</span></div><div class="wb"><ul class="list" id="objects"></ul></div></div>
      <div class="win" id="invpanel" style="display:none"><div class="tb"><span class="t">Your pockets</span></div><div class="wb"><div id="inv" class="note"></div></div></div>
    </aside>
  </div>
  <footer><span>The palace remembers your walk in this browser only. <a href="/puzzles/">Plain list of devices</a> · <a href="/palace/curator/">Curator's guide</a></span></footer>
</main>
<div class="overlay" id="ov"><div class="sheet win"><div class="tb"><button class="box" type="button" id="ovx" aria-label="Close"></button><span class="t" id="ovt"></span></div><div class="wb" id="ovb"></div></div></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="sky.js"></script>
<script src="palace.js"></script>
</body>
</html>
